version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: sismowatch-airflow:2.9.3
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
    - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
    - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    - S3_ENDPOINT_URL=http://minio:9000
    - OLLAMA_HOST=http://host.docker.internal:11435
    - SPARK_MASTER_URL=spark://spark-master:7077
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/include:/opt/airflow/include
    - ./airflow/tests:/opt/airflow/tests
    - ./logs:/opt/airflow/logs
    - ./data/lakehouse:/opt/airflow/data/lakehouse
  depends_on:
    postgres:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - sismowatch_net

services:
  # --- BASE DE DATOS POSTGRESQL (METASTORE AIRFLOW Y SISMOWATCH_DB) ---
  postgres:
    image: postgres:15-alpine
    container_name: sismowatch_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sismowatch_net

  # --- DATALAKEHOUSE S3 (MINIO) ---
  minio:
    image: coollabsio/minio:latest
    container_name: sismowatch_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sismowatch_net

  minio-init:
    image: python:3.11-alpine
    container_name: sismowatch_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./db/init:/db/init
    command: >
      sh -c "
      pip install --no-cache-dir boto3 > /dev/null 2>&1 &&
      python /db/init/init_minio.py
      "
    networks:
      - sismowatch_net

  # --- APACHE AIRFLOW (INIT, WEBSERVER Y SCHEDULER) ---
  airflow-init:
    <<: *airflow-common
    container_name: sismowatch_airflow_init
    command: version
    entrypoint: >
      /bin/bash -c "
      airflow db migrate &&
      airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Data --lastname Admin --role Admin --email ${AIRFLOW_ADMIN_EMAIL}
      "

  airflow-webserver:
    <<: *airflow-common
    container_name: sismowatch_airflow_webserver
    restart: always
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: sismowatch_airflow_scheduler
    restart: always
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully


  # --- BACKEND API (FASTAPI) ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sismowatch_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${APP_DB}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - OLLAMA_HOST=http://host.docker.internal:11435
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api/app:/app/app
      - ./logs:/app/logs
      - ./data/lakehouse:/app/data/lakehouse
      - ./tests:/app/tests
    networks:
      - sismowatch_net

  # --- FRONTEND (REACT + VITE + TAILWIND) ---
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sismowatch_web
    restart: always
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - sismowatch_net

volumes:
  postgres_data:
  minio_data:

networks:
  sismowatch_net:
    driver: bridge
